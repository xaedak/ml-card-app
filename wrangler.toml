name = "ml-card-worker"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Fonts and the resvg wasm binary get bundled straight into the worker.
# Template background PNGs are NOT bundled (too big for a clean bundle) -
# they're fetched at request time from your GitHub repo's raw URLs and
# cached at the edge. See src/templates.js.
[[rules]]
type = "Data"
globs = ["**/*.ttf"]
fallthrough = true

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

# KV namespace used to hold each user's in-progress answers between the
# select-menu / modal steps (a few minutes of state, auto-expires).
# Create it with: wrangler kv namespace create SESSIONS
# then paste the id it prints in place of REPLACE_WITH_KV_ID below.
[[kv_namespaces]]
binding = "SESSIONS"
id = "REPLACE_WITH_KV_ID"

# Secrets (set with `wrangler secret put NAME`, never written to this file):
#   DISCORD_PUBLIC_KEY   - from Discord Developer Portal > General Information
#   DISCORD_BOT_TOKEN    - from Discord Developer Portal > Bot
#   DISCORD_APPLICATION_ID - from Discord Developer Portal > General Information
#   CARD_CHANNEL_ID       - the channel ID cards get posted to
#   TEMPLATE_BASE_URL     - raw GitHub base URL for your template PNGs, e.g.
#                           https://raw.githubusercontent.com/USER/REPO/main/assets/templates
